<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Real Lips. Real Results. — Carousel</title>
<style>
  @font-face { font-family:'Playfair Display'; src:url('fonts/PlayfairDisplay.ttf'); }
  @font-face { font-family:'Pinyon Script'; src:url('fonts/PinyonScript-Regular.ttf'); }
  @font-face { font-family:'Jost'; src:url('fonts/Jost.ttf'); }

  :root{ --cream:#F3EEE5; --ink:#2E2A23; --ink-soft:#6E6557; --hair:rgba(46,42,35,.35); --gold:#C9A85C; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#888;}
  .slide{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:var(--cream);color:var(--ink);font-family:'Jost',sans-serif;
  }
  .slide:not(.active){display:none !important;}
  .monogram{position:absolute;top:64px;left:80px;}
  .label{font-size:23px;letter-spacing:.38em;text-transform:uppercase;color:var(--ink-soft);}
  .serif{font-family:'Playfair Display',serif;font-weight:500;font-size:92px;line-height:1;}
  .script{font-family:'Pinyon Script',cursive;font-size:88px;line-height:.95;}
  .disclaimer{
    position:absolute;left:0;right:0;bottom:34px;text-align:center;
    font-size:17px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(110,101,87,.75);font-weight:300;
  }
  .handle{
    font-size:20px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:300;
  }

  /* cover */
  .cover .head{padding:150px 80px 0;text-align:center;}
  .cover .serif{font-size:104px;}
  .cover .script{font-size:96px;margin-top:6px;}
  .cover .strip{
    position:absolute;top:600px;left:80px;right:80px;height:430px;
    display:flex;gap:16px;
  }
  .cover .strip div{flex:1;overflow:hidden;background:#E5DCCA;}
  .cover .strip img{width:100%;height:100%;object-fit:cover;}
  .cover .sub{
    position:absolute;left:80px;right:80px;bottom:112px;text-align:center;
    font-size:27px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  }
  .cover .swipe{
    position:absolute;left:0;right:0;bottom:70px;text-align:center;
    font-size:21px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);
  }

  /* result */
  .head{padding:104px 80px 0;text-align:center;}
  .title{margin-top:26px;}
  .pair{position:absolute;top:372px;left:80px;right:80px;height:520px;display:flex;gap:20px;}
  .frame{flex:1;position:relative;overflow:hidden;background:#E5DCCA;}
  .frame img{width:100%;height:100%;object-fit:cover;}
  .frame .tag{
    position:absolute;left:0;bottom:0;background:rgba(243,238,229,.94);
    font-size:21px;letter-spacing:.32em;text-transform:uppercase;padding:14px 26px;font-weight:500;
  }
  .foot{position:absolute;left:80px;right:80px;bottom:78px;}
  .note{font-size:30px;line-height:1.5;letter-spacing:.06em;color:var(--ink);text-align:center;}
  .rule{height:1px;background:var(--hair);margin:34px 0 24px;}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:36px;}
  .count{
    font-size:24px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;
  }

  /* cta */
  .cta-slide{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;text-align:center;padding:0 110px;}
  .cta-slide .serif{font-size:96px;}
  .cta-slide .script{font-size:92px;margin-top:4px;}
  .cta-slide .body{
    margin-top:52px;font-size:30px;line-height:1.6;letter-spacing:.06em;color:var(--ink-soft);
  }
  .cta-slide .button{
    margin-top:60px;border:1px solid var(--ink);padding:26px 54px;
    font-size:24px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* Photos come from photos/cleo/crops/ — cropped to the treatment area, so no
   face is in the published file. See design/photos/cleo/README.md. */
const C = 'photos/cleo/crops/';
const RESULTS = [
  { before:C+'img_9908.jpg', after:C+'img_9912.jpg',
    serif:'RESULT', script:'one.',
    note:'One syringe. Volume and definition, with her own lip line kept exactly where it was.' },
  { before:C+'img_0221.jpg', after:C+'img_0233.jpg',
    serif:'RESULT', script:'two.',
    note:'A thin upper lip brought into balance with the lower. Same mouth, finally in proportion.' },
  { before:C+'img_0962.jpg', after:C+'img_0998.jpg',
    serif:'RESULT', script:'three.',
    note:'Profile view. Projection and a defined border, without pushing past what her face carries.' },
  { before:C+'img_1119.jpg', after:C+'img_1123.jpg',
    serif:'RESULT', script:'four.',
    note:'The subtle one. If you have to look twice to see it, that is the work doing its job.' },
  { before:C+'img_9848.jpg', after:C+'img_9850.jpg', afterTag:'Right after',
    serif:'RESULT', script:'five.',
    note:'Shot minutes apart, swelling and pinpoint marks included. Day zero is honest, not finished.' },
];
const TOTAL = RESULTS.length;

const n = parseInt(new URLSearchParams(location.search).get('slide') || '1', 10);
const mono = '<img class="monogram" src="brand/logo-monogram.png" width="104" alt="LB">';
const disc = '<div class="disclaimer">Shared with client consent. Individual results vary.</div>';
let html;

if (n === 1) {
  html = `<div class="slide active cover">
    ${mono}
    <div class="head">
      <div class="label">Five Clients &#183; One Syringe Each</div>
      <div style="margin-top:30px">
        <div class="serif">REAL LIPS.</div>
        <div class="script">real results.</div>
      </div>
    </div>
    <div class="strip">
      <div><img src="${C}img_0233.jpg" alt=""></div>
      <div><img src="${C}img_9912.jpg" alt=""></div>
      <div><img src="${C}img_1123.jpg" alt=""></div>
    </div>
    <div class="sub">No filters. No angles. Same light, same day.</div>
    <div class="swipe">Swipe &#8594;</div>
    ${disc}
  </div>`;
} else if (n >= 2 && n <= TOTAL + 1) {
  const r = RESULTS[n - 2];
  html = `<div class="slide active">
    ${mono}
    <div class="head">
      <div class="label">Real Result &#183; One Syringe</div>
      <div class="title">
        <div class="serif">${r.serif}</div>
        <div class="script">${r.script}</div>
      </div>
    </div>
    <div class="pair">
      <div class="frame"><img src="${r.before}" alt="Before"><div class="tag">Before</div></div>
      <div class="frame"><img src="${r.after}" alt="After"><div class="tag">${r.afterTag || 'After'}</div></div>
    </div>
    <div class="foot">
      <div class="note">${r.note}</div>
      <div class="rule"></div>
      <div class="row">
        <div class="count">${n - 1} of ${TOTAL}</div>
        <div class="handle">@luxury_beauty_aestheticz</div>
      </div>
    </div>
    ${disc}
  </div>`;
} else {
  html = `<div class="slide active">
    ${mono}
    <div class="cta-slide">
      <div class="serif">YOUR LIPS,</div>
      <div class="script">your plan.</div>
      <div class="body">
        Every one of these started with a consult, not a syringe. We look at your
        lip line, your proportions and what you actually want, then decide together
        whether filler is even the answer.
      </div>
      <div class="button">DM &#8220;Lips&#8221; to book</div>
      <div class="handle" style="margin-top:44px">@luxury_beauty_aestheticz</div>
    </div>
    ${disc}
  </div>`;
}
document.getElementById('stage').innerHTML = html;
</script>
</body>
</html>
