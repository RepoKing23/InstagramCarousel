<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Before and After — Result Template</title>
<style>
  @font-face { font-family:'Playfair Display'; src:url('fonts/PlayfairDisplay.ttf'); }
  @font-face { font-family:'Pinyon Script'; src:url('fonts/PinyonScript-Regular.ttf'); }
  @font-face { font-family:'Jost'; src:url('fonts/Jost.ttf'); }

  :root{
    --cream:#F3EEE5;
    --ink:#2E2A23;
    --ink-soft:#6E6557;
    --hair:rgba(46,42,35,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#888;}
  .slide{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:var(--cream);color:var(--ink);
    font-family:'Jost',sans-serif;
  }
  .slide:not(.active){display:none !important;}

  .head{padding:104px 80px 0;text-align:center;}
  .label{
    font-size:23px;letter-spacing:.38em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:400;
  }
  .title{margin-top:26px;}
  .title .serif{
    font-family:'Playfair Display',serif;font-weight:500;
    font-size:92px;line-height:1;letter-spacing:.01em;
  }
  .title .script{
    font-family:'Pinyon Script',cursive;font-size:88px;line-height:.95;
  }

  /* photo pair */
  .pair{
    position:absolute;top:372px;left:80px;right:80px;height:520px;
    display:flex;gap:20px;
  }
  .frame{flex:1;position:relative;overflow:hidden;background:#E5DCCA;}
  .frame img{width:100%;height:100%;object-fit:cover;}
  .frame .tag{
    position:absolute;left:0;bottom:0;
    background:rgba(243,238,229,.94);color:var(--ink);
    font-size:21px;letter-spacing:.32em;text-transform:uppercase;
    padding:14px 26px;font-weight:500;
  }

  .foot{
    position:absolute;left:80px;right:80px;bottom:78px;
  }
  .changes{display:flex;flex-direction:column;gap:20px;}
  .changes .item{display:flex;align-items:center;gap:22px;}
  .changes .mark{
    width:34px;height:34px;flex:none;border-radius:50%;
    background:#C9A85C;color:#FFF;font-size:19px;font-weight:600;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .changes .txt{
    font-size:26px;font-weight:400;letter-spacing:.14em;
    text-transform:uppercase;line-height:1.3;color:var(--ink);
  }
  .quote{
    font-family:'Playfair Display',serif;font-size:44px;line-height:1.34;
    font-style:italic;color:var(--ink);text-align:center;padding:0 24px;
  }
  .quote .who{
    display:block;margin-top:30px;font-family:'Jost',sans-serif;
    font-style:normal;font-size:21px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--ink-soft);font-weight:400;
  }
  .rule{height:1px;background:var(--hair);margin:34px 0 24px;}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:36px;}
  .cta{
    font-size:24px;letter-spacing:.3em;text-transform:uppercase;
    font-weight:500;color:var(--ink);white-space:nowrap;
  }
  .handle{
    font-size:20px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:300;white-space:nowrap;
  }
  .disclaimer{
    position:absolute;left:0;right:0;bottom:34px;text-align:center;
    font-size:17px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(110,101,87,.75);font-weight:300;
  }
  .monogram{position:absolute;top:64px;left:80px;}
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* One result card per pair. Photos come from photos/cleo/crops/ — already cropped
   to the treatment area, so no face is in the published file. See
   design/photos/cleo/README.md. */
const C = 'photos/cleo/crops/';
const SLIDES = [
  { /* 1 — Oct 8, pair E */
    label:'Real Result &#183; One Syringe',
    serif:'LIP FILLER', script:'done right.',
    before:C+'img_9908.jpg', after:C+'img_9912.jpg',
    bullets:['Adds volume and definition','Balanced upper and lower lip',
             'Natural movement, never stiff','Non-surgical, about 30 minutes'],
    cta:'DM &#8220;Lips&#8221; to learn more' },

  { /* 2 — Oct 10, pair C */
    label:'Real Result &#183; One Syringe',
    serif:'THE BEST WORK', script:'whispers.',
    before:C+'img_1119.jpg', after:C+'img_1123.jpg',
    bullets:['Subtle volume, not a new mouth','Softens a flat lip border',
             'Still unmistakably her','One syringe, about 30 minutes'],
    cta:'Save this' },

  { /* 3 — Oct 24, pair B */
    label:'Client Words &#183; Real Result',
    serif:'HER WORDS,', script:'her result.',
    before:C+'img_0962.jpg', after:C+'img_0998.jpg',
    quote:'Nobody said filler. They said I looked prettier and could not say why.',
    who:'Lip filler client, shared with permission',
    cta:'Your turn. DM &#8220;Filler&#8221;' },

  { /* 4 — Oct 30, pair A */
    label:'Real Result &#183; One Syringe',
    serif:'ONE SYRINGE', script:'balanced lips.',
    before:C+'img_0221.jpg', after:C+'img_0233.jpg',
    bullets:['Balanced upper and lower lip','Definition through the lip line',
             'Placed where her lip needed it','One syringe, about 30 minutes'],
    cta:'Book a consult &#183; Link in bio' },
];

const n = parseInt(new URLSearchParams(location.search).get('slide') || '1', 10);
const s = SLIDES[n - 1];

const body = s.quote
  ? `<div class="quote">&#8220;${s.quote}&#8221;<span class="who">${s.who}</span></div>`
  : `<div class="changes">${s.bullets.map(b =>
      `<div class="item"><span class="mark">&#10003;</span><span class="txt">${b}</span></div>`
    ).join('')}</div>`;

document.getElementById('stage').innerHTML = `
<div class="slide active">
  <img class="monogram" src="brand/logo-monogram.png" width="104" alt="LB">
  <div class="head">
    <div class="label">${s.label}</div>
    <div class="title">
      <div class="serif">${s.serif}</div>
      <div class="script">${s.script}</div>
    </div>
  </div>
  <div class="pair">
    <div class="frame"><img src="${s.before}" alt="Before"><div class="tag">Before</div></div>
    <div class="frame"><img src="${s.after}" alt="After"><div class="tag">After</div></div>
  </div>
  <div class="foot">
    ${body}
    <div class="rule"></div>
    <div class="row">
      <div class="cta">${s.cta}</div>
      <div class="handle">@luxury_beauty_aestheticz</div>
    </div>
  </div>
  <div class="disclaimer">Shared with client consent. Individual results vary.</div>
</div>`;
</script>
</body>
</html>
