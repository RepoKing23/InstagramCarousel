<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Before and After — Result Template</title>
<style>
  @font-face { font-family:'Playfair Display'; src:url('fonts/PlayfairDisplay.ttf'); }
  @font-face { font-family:'Pinyon Script'; src:url('fonts/PinyonScript-Regular.ttf'); }
  @font-face { font-family:'Jost'; src:url('fonts/Jost.ttf'); }

  :root{
    --cream:#F3EEE5;
    --ink:#2E2A23;
    --ink-soft:#6E6557;
    --hair:rgba(46,42,35,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#888;}
  .slide{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:var(--cream);color:var(--ink);
    font-family:'Jost',sans-serif;
  }
  .slide:not(.active){display:none !important;}

  .head{padding:104px 80px 0;text-align:center;}
  .label{
    font-size:23px;letter-spacing:.38em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:400;
  }
  .title{margin-top:26px;}
  .title .serif{
    font-family:'Playfair Display',serif;font-weight:500;
    font-size:92px;line-height:1;letter-spacing:.01em;
  }
  .title .script{
    font-family:'Pinyon Script',cursive;font-size:88px;line-height:.95;
  }

  /* photo pair */
  .pair{
    position:absolute;top:410px;left:80px;right:80px;height:600px;
    display:flex;gap:20px;
  }
  .frame{flex:1;position:relative;overflow:hidden;background:#E5DCCA;}
  .frame img{width:100%;height:100%;object-fit:cover;}
  .frame .tag{
    position:absolute;left:0;bottom:0;
    background:rgba(243,238,229,.94);color:var(--ink);
    font-size:21px;letter-spacing:.32em;text-transform:uppercase;
    padding:14px 26px;font-weight:500;
  }

  .foot{
    position:absolute;left:80px;right:80px;bottom:78px;
  }
  .note{
    text-align:center;font-size:27px;font-weight:300;letter-spacing:.1em;
    line-height:1.7;color:var(--ink-soft);
  }
  .note strong{font-weight:500;color:var(--ink);}
  .rule{height:1px;background:var(--hair);margin:38px 0 26px;}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:36px;}
  .cta{
    font-size:24px;letter-spacing:.3em;text-transform:uppercase;
    font-weight:500;color:var(--ink);white-space:nowrap;
  }
  .handle{
    font-size:20px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:300;white-space:nowrap;
  }
  .disclaimer{
    position:absolute;left:0;right:0;bottom:34px;text-align:center;
    font-size:17px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(110,101,87,.75);font-weight:300;
  }
  .monogram{position:absolute;top:64px;left:80px;}
</style>
</head>
<body>

<!-- LIP FILLER RESULT -->
<div class="slide" id="slide1">
  <img class="monogram" src="brand/logo-monogram.png" width="104" alt="LB">
  <div class="head">
    <div class="label">Real Result &#183; One Syringe</div>
    <div class="title">
      <div class="serif">LIP FILLER</div>
      <div class="script">done right.</div>
    </div>
  </div>

  <div class="pair">
    <div class="frame">
      <img src="photos/cleo/img_9908.jpg" style="object-position:50% 48%;" alt="Before">
      <div class="tag">Before</div>
    </div>
    <div class="frame">
      <img src="photos/cleo/img_9912.jpg" style="object-position:50% 48%;" alt="After">
      <div class="tag">After</div>
    </div>
  </div>

  <div class="foot">
    <div class="note">She said make them fuller but do not make it obvious.<br>So we did one syringe and <strong>stopped</strong>.</div>
    <div class="rule"></div>
    <div class="row">
      <div class="cta">DM &#8220;Lips&#8221; to learn more</div>
      <div class="handle">@luxury_beauty_aestheticz</div>
    </div>
  </div>
  <div class="disclaimer">Shared with client consent. Individual results vary.</div>
</div>

<script>
  const n = new URLSearchParams(location.search).get('slide') || '1';
  document.getElementById('slide' + n).classList.add('active');
</script>
</body>
</html>
